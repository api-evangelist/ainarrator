name: Narrator platform lifecycle
note: >-
  NO apis.yml pointer is emitted for this file. It records an END OF LIFE that API Evangelist
  OBSERVED; it is not a lifecycle, deprecation or status policy that Narrator published. Wiring
  a Lifecycle / StatusPage / Deprecation pointer here would credit the company with an
  operational practice it does not have.
status: end-of-life
summary: >-
  Narrator (Y Combinator S2019, New York) shut down its hosted platform. Y Combinator lists the
  company as Inactive. The narrator.ai apex and www host now 301-redirect to narratordata.com,
  an unrelated WordPress site, and the API, application, GraphQL and status subdomains have been
  removed from DNS entirely. The documentation host is a dangling third-party CNAME. In place of
  the service, the company published its complete platform source under an MIT license.
