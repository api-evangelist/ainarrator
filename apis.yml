aid: ainarrator
name: Narrator
description: 'Narrator was a New York data-intelligence company (Y Combinator S2019) that
  built an end-to-end analytics platform on top of the Activity Schema — a single time-series
  modeling approach it published as an alternative to star-schema warehouse modeling — covering
  warehouse transformations, dataset and narrative building, customer-journey analysis and
  scheduled materializations. The company raised roughly $7.6M and is listed by Y Combinator
  as Inactive; its narrator.ai domain now 301-redirects to an unrelated WordPress site, and
  its API, app and documentation hosts no longer resolve or serve. The only surviving
  first-party surface is the narratorai GitHub organization, where the full platform source
  (Hasura graph, the Mavis Python service, and the Next.js portal) was published under an MIT
  license in February 2025.'
